<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tienda de Bicicletas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inicio' %}">Tienda de Bicicletas</a>
            <div>
                <a class="btn btn-outline-light btn-sm" href="{% url 'lista_bicicletas' %}">Ver bicicletas</a>
                <a class="btn btn-success btn-sm" href="{% url 'crear_bicicleta' %}">Nueva bicicleta</a>
            </div>
        </div>
    </nav>
 
    <main class="container">
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
 
        {% block content %}{% endblock %}
    </main>
</body>
</html>
