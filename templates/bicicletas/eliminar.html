{% extends "base.html" %}
 
{% block title %}Eliminar bicicleta{% endblock %}
 
{% block content %}
<div class="card border-danger shadow-sm">
    <div class="card-body">
        <h1 class="text-danger">Confirmar eliminación</h1>
        <p>¿Seguro que deseas eliminar la bicicleta <strong>{{ bicicleta }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Sí, eliminar</button>
            <a class="btn btn-secondary" href="{% url 'lista_bicicletas' %}">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
